[project]
name = "podcraft_ai"
version = "0.1.0"
description = "a multi-agent podcast generation system"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]>=0.175.0,<1.0.0"
]

[project.scripts]
podcaster = "podcraft.main:run"
run_crew = "podcraft.main:run"
train = "podcraft.main:train"
replay = "podcraft.main:replay"
test = "podcraft.main:test"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
